[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-extract"
version = "1.1.0"
description = "Local-first video-to-text pipeline: faster-whisper ASR, RapidOCR hard-subtitle/slide OCR, time-aligned ASR correction, and optional LLM summaries"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper",
  "yt-dlp",
  "rapidocr-onnxruntime",
  "opencv-python-headless",
  "openai",
  "opencc-python-reimplemented",
  "imageio-ffmpeg",
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27"]

[project.scripts]
video-extract = "extract:main"

[tool.setuptools]
py-modules = ["extract", "server", "eval_repair"]

[tool.pytest.ini_options]
testpaths = ["tests"]
